<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXOR | GERENCIADOR</title>
  <link rel="icon" type="image/jpeg" href="logo-nexor.jpeg">
  <style>
    /* Reset de margens e controle de rolagem */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0e1a;
    }

    /* Container do iframe para garantir proporções exatas */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Estilização do iframe em tela cheia */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
    }

    /* Tela de carregamento profissional */
    .loader-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #161b33 0%, #0b0e1a 62%, #05060d 100%);
      overflow: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Brilhos animados de fundo */
    .loader-screen::before,
    .loader-screen::after {
      content: "";
      position: absolute;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    .loader-screen::before {
      top: -30vmax;
      left: -15vmax;
      background: #2b66ff;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .loader-screen::after {
      bottom: -32vmax;
      right: -18vmax;
      background: #7a5cff;
      animation: drift 16s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8vmax, 6vmax) scale(1.15); }
    }

    /* Emblema da logo */
    .loader-logo-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 150px;
      height: 150px;
      animation: float 4s ease-in-out infinite;
    }

    .loader-logo {
      width: 116px;
      height: 116px;
      border-radius: 26px;
      object-fit: cover;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 0 42px rgba(64, 114, 255, 0.45);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    /* Anel de carregamento ao redor da logo */
    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.06);
      border-top: 3px solid #4d7cff;
      border-right: 3px solid rgba(122, 92, 255, 0.8);
      animation: spin 1.1s linear infinite;
    }

    .loader-ring-soft {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.09);
      animation: spin 22s linear infinite reverse;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-title {
      position: relative;
      z-index: 1;
      margin-top: 40px;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .loader-title span {
      color: #7aa0ff;
    }

    .loader-subtitle {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1.5px;
    }

    /* Barra de progresso */
    .progress-track {
      position: relative;
      z-index: 1;
      width: 280px;
      height: 5px;
      margin-top: 36px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2b66ff, #7a5cff);
      box-shadow: 0 0 16px rgba(90, 118, 255, 0.7);
      animation: progress 3.2s cubic-bezier(0.25, 0.8, 0.35, 1) infinite;
    }

    @keyframes progress {
      0%   { width: 0%; }
      55%  { width: 82%; }
      90%  { width: 96%; }
      100% { width: 100%; }
    }

    .loader-status {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .loader-status::after {
      content: "";
      display: inline-block;
      width: 6px;
      margin-left: 6px;
      text-align: left;
      animation: dots 1.4s steps(4, end) infinite;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
    }

    .loader-footer {
      position: absolute;
      bottom: 26px;
      z-index: 1;
      color: rgba(255, 255, 255, 0.28);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Tela de Carregamento -->
    <div id="loader" class="loader-screen">
      <div class="loader-logo-wrap">
        <div class="loader-ring-soft"></div>
        <div class="loader-ring"></div>
        <img class="loader-logo" src="logo-nexor.jpeg" alt="Nexor">
      </div>
      <h1 class="loader-title">Nexor <span>Gerenciador</span></h1>
      <p class="loader-subtitle">Sistema de Gestão Inteligente</p>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <p class="loader-status">Inicializando sistema</p>
      <p class="loader-footer">Nexor &copy; 2026</p>
    </div>

    <!-- Iframe em Tela Cheia -->
    <iframe
      id="webAppFrame"
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbzo-P1gi7dcxJRjkk6g5HZPUgz0e8uxvjtCGFLlSozzQQlGxGzZCIRJekNceMo1lcBZbw/exec"
      allow="geolocation; microphone; camera; clipboard-write;"
      onload="hideLoader()">
    </iframe>
  </div>

  <script>
    // Esconde a tela de carregamento assim que o iframe termina de carregar
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
      }
    }

    // Fallback de segurança: nunca deixar a tela presa
    setTimeout(function () {
      hideLoader();
    }, 20000);
  </script>

</body>
</html>
